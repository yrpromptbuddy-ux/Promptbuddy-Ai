<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Prompt Buddy – Your AI Partner</title>
<style>
:root{--bg:#f4f5ff;--card:#fff;--tx:#12122b;--mut:#6b6f8a;--ac:#6d4aff;--bd:#e3e5f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f20;--card:#181b34;--tx:#eef0ff;--mut:#9aa0c4;--bd:#2b2f55}}
:root[data-theme="dark"]{--bg:#0d0f20;--card:#181b34;--tx:#eef0ff;--mut:#9aa0c4;--bd:#2b2f55}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;overflow-x:hidden}
a{color:inherit}.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.4;animation:drift 16s ease-in-out infinite alternate;pointer-events:none;z-index:0}
.b1{width:360px;height:360px;background:#6d4aff;top:-100px;left:-100px}.b2{width:320px;height:320px;background:#2f9bff;bottom:-80px;right:-80px;animation-delay:-6s}.b3{width:240px;height:240px;background:#ff5fd2;top:50%;right:-80px;animation-delay:-10s;opacity:.25}
@keyframes drift{to{transform:translate(70px,60px) scale(1.25)}}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 20px;background:color-mix(in srgb,var(--card) 80%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;text-decoration:none;margin-right:auto}.logo .av{width:38px;height:38px}
.gt{background:linear-gradient(90deg,#2f7bff,#b341ff);-webkit-background-clip:text;background-clip:text;color:transparent}
nav .ls{display:flex;gap:4px;align-items:center}nav .ls a{padding:8px 14px;border-radius:99px;text-decoration:none;font-weight:600;color:var(--mut);transition:.2s}
nav .ls a:hover,nav .ls a.act{color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}nav .ls a.cta{background:linear-gradient(120deg,#2f7bff,#9b4bff);color:#fff}
#hm{display:none;background:none;border:2px solid var(--bd);color:var(--tx);border-radius:10px;font-size:20px;padding:4px 10px;cursor:pointer}
@media(max-width:760px){#hm{display:block}nav{flex-wrap:wrap}nav .ls{display:none;flex-direction:column;width:100%;align-items:stretch}nav.open .ls{display:flex;animation:rise .3s}}
.av{width:44px;height:44px;border-radius:50%;background:#fff;overflow:hidden;flex:none;border:2px solid var(--bd)}.av img,.mascot img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
main{position:relative;z-index:1;min-height:80vh}.pg{animation:pgin .6s cubic-bezier(.2,.9,.3,1) both}@keyframes pgin{from{opacity:0;transform:translateY(24px)}}
.sec{max-width:1040px;margin:0 auto;padding:44px 20px}.sec h2{font-size:clamp(26px,4vw,38px);margin:0 0 8px;text-align:center}.sub{text-align:center;color:var(--mut);margin:0 0 28px}
.hero{max-width:1040px;margin:0 auto;padding:40px 20px;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
@media(max-width:800px){.hero{grid-template-columns:1fr;text-align:center}.hero .bt{justify-content:center}}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.08;margin:0 0 14px;letter-spacing:-1px}.hero p{color:var(--mut);font-size:18px;margin:0 0 22px}.bt{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:13px 24px;border-radius:99px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(120deg,#2f7bff,#9b4bff);text-decoration:none;border:0;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 10px 24px #6d4aff55}.btn.g{background:none;border:2px solid var(--bd);color:var(--tx)}.btn.ok{background:#16a34a}.btn.r{background:#e5484d}
.stage{position:relative;display:grid;place-items:center;min-height:380px}
.mascot{position:relative;width:min(270px,62vw);aspect-ratio:3/4;border-radius:36px;background:#fff;box-shadow:0 20px 60px #6d4aff44;animation:float 3.5s ease-in-out infinite}
.mascot img{border-radius:36px}.sw{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.8);opacity:.3}}.mascot:before,.mascot:after{content:"";position:absolute;inset:-12px;border-radius:46px;border:2px solid var(--ac);opacity:0;animation:pulse 2.6s infinite}.mascot:after{animation-delay:1.3s}
.mascot.talk{animation:talk .5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px)}}@keyframes pulse{0%{transform:scale(.95);opacity:.7}100%{transform:scale(1.4);opacity:0}}@keyframes talk{25%{transform:rotate(-5deg) scale(1.04)}75%{transform:rotate(5deg) scale(1.04)}}
.orb{position:absolute;inset:0;animation:spin 9s linear infinite;pointer-events:none}.orb i{position:absolute;top:2%;left:50%;font-style:normal;font-size:22px}.orb i:nth-child(2){top:50%;left:98%}.orb i:nth-child(3){top:96%;left:30%}@keyframes spin{to{transform:rotate(360deg)}}
.sp{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px 16px;font-weight:600;box-shadow:0 8px 24px #6d4aff22;position:relative;min-height:46px}
.sp:after{content:"";position:absolute;left:30px;top:-8px;width:16px;height:16px;background:var(--card);border-left:1px solid var(--bd);border-top:1px solid var(--bd);transform:rotate(45deg)}
.hero .sp{position:absolute;top:6px;left:0;max-width:190px;z-index:2}
.mq{overflow:hidden;white-space:nowrap;background:linear-gradient(90deg,#2f7bff,#b341ff);color:#fff;padding:12px 0;font-weight:700;position:relative;z-index:1}.mq div{display:inline-block;animation:mq 22s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.sv{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:20px;text-align:left;font:inherit;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;position:relative;overflow:hidden;text-decoration:none;display:block}
.sv:hover{transform:translateY(-8px) rotate(-.8deg);border-color:var(--c);box-shadow:0 14px 30px color-mix(in srgb,var(--c) 30%,transparent)}
.sv:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff5 50%,transparent 70%);transform:translateX(-120%);animation:shine 4s infinite;animation-delay:calc(var(--i)*.5s)}@keyframes shine{40%,100%{transform:translateX(120%)}}
.sv .ic{font-size:36px;display:block;animation:float 3s ease-in-out infinite;animation-delay:calc(var(--i)*.3s)}.sv b{display:block;font-size:18px;margin:6px 0 4px}.sv p{margin:0 0 10px;color:var(--mut);font-size:14px}
.pr{display:inline-block;padding:3px 12px;border-radius:99px;background:var(--c);color:#fff;font-size:14px;font-weight:700}
.rv{opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s cubic-bezier(.2,.9,.3,1);transition-delay:calc(var(--i,0)*.1s)}.rv.on{opacity:1;transform:none}
.ft{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;text-align:center;transition:.25s}.ft:hover{transform:translateY(-6px);border-color:var(--ac)}.ft .ic{font-size:34px;display:block}.ft b{display:block}
.sv.big{cursor:default}.sv.big ul{padding-left:18px;margin:0 0 14px;color:var(--mut);font-size:14px}.sv.big:hover{transform:translateY(-6px)}
.steps{counter-reset:s}.st{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;position:relative}.st:before{counter-increment:s;content:counter(s);position:absolute;top:-16px;left:18px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(120deg,#2f7bff,#9b4bff)}
.band{margin:20px;border-radius:28px;padding:40px 20px;text-align:center;color:#fff;background:linear-gradient(120deg,#2f7bff,#9b4bff,#ff5fd2,#2f7bff);background-size:300% 100%;animation:flow 8s linear infinite}@keyframes flow{to{background-position:300% 0}}
.band .btn{background:#fff;color:#6d4aff}
.wzbox{display:grid;grid-template-columns:240px 1fr;gap:26px;align-items:start}@media(max-width:760px){.wzbox{grid-template-columns:1fr}}
.botcol{display:flex;flex-direction:column;align-items:center;gap:22px}.botcol .mascot{width:170px}.botcol .sp{width:100%}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:24px;min-height:300px;box-shadow:0 10px 40px #6d4aff18}.panel.in{animation:slide .5s cubic-bezier(.2,.9,.3,1) both}@keyframes slide{from{opacity:0;transform:translateX(var(--dx,40px))}}
.panel h3{margin:6px 0 16px;font-size:22px}.stp{display:flex;gap:6px}.stp i{height:6px;flex:1;border-radius:9px;background:var(--bd);transition:.4s}.stp i.d{background:var(--ac)}.stp i.a{background:linear-gradient(90deg,#2f7bff,#b341ff)}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{border:2px solid var(--ac);background:none;color:var(--ac);padding:10px 18px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer;transition:.15s;animation:rise .4s both;animation-delay:calc(var(--i)*.06s)}
.chip:hover,.chip.on{background:var(--ac);color:#fff;transform:translateY(-3px)}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.panel input[type=text],.panel input[type=number]{width:100%;padding:13px 16px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:18px}.panel input:focus{outline:0;border-color:var(--ac)}
.sk{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.num{display:flex;gap:10px;align-items:center}.num input{text-align:center;font-weight:700}.sb{width:50px;height:50px;border-radius:50%;border:2px solid var(--ac);background:none;color:var(--ac);font-size:24px;cursor:pointer;flex:none}.sb:hover{background:var(--ac);color:#fff}
.nv{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.hint{color:var(--mut);font-size:13px;margin-top:6px}#er{color:#e5484d;min-height:18px}.priv{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:14px;background:color-mix(in srgb,#16a34a 12%,transparent);border:1px solid color-mix(in srgb,#16a34a 40%,transparent)}
.calc{text-align:center}.calc small{color:var(--mut)}.amt{font-size:56px;font-weight:800;line-height:1.1}.amt{background:linear-gradient(90deg,#2f7bff,#b341ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sum{width:100%;border-radius:14px;display:block;margin:14px 0;animation:rise .6s both}
.ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:16px 0}.ct a{display:block;padding:18px;border-radius:18px;text-decoration:none;font-weight:700;word-break:break-all;font-size:18px;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(120deg,#2f7bff,#ff5fd2,#2f7bff) border-box;border:2px solid transparent;background-size:100%,300% 100%;animation:flow2 3s linear infinite;transition:.2s}.ct a:hover{transform:translateY(-5px)}
.ct a span{display:block;color:var(--mut);font-weight:400;font-size:13px}@keyframes flow2{to{background-position:0 0,300% 0}}
footer{position:relative;z-index:1;text-align:center;padding:30px 20px;color:var(--mut);border-top:1px solid var(--bd);background:color-mix(in srgb,var(--card) 70%,transparent)}footer a{margin:0 8px;font-weight:600}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
